services:
  postgres:
    image: postgres:17

    container_name: homesec-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: homesec
      POSTGRES_USER: homesec
      POSTGRES_PASSWORD: homesec

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: